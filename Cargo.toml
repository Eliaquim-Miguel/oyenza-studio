[workspace]
resolver = "2"
members = ["crates/poni-core", "crates/poni"]

[workspace.package]
version = "0.1.1"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
