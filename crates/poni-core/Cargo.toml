[package]
name = "poni-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-independent models and logic for the Poni island (pure Rust, unit-tested on any OS)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
# QR codes for the phone-drop link (MIT, no dependencies).
qrcodegen = "1.8"
# Pairing keys and signed messages (RustCrypto, MIT OR Apache-2.0; str0m
# already pulls both in).
sha2 = "0.10"
hmac = "0.12"

# Paired phone drop: the direct link to a phone's browser (WebRTC data
# channels; MIT OR Apache-2.0). Sans I/O, so the sockets and threads stay
# ours. On Windows its DTLS runs on the system's own crypto (CNG), so no C
# library is built into poni.exe; elsewhere (Linux tests) on RustCrypto.
[target.'cfg(windows)'.dependencies]
str0m = { version = "0.24.1", default-features = false, features = ["wincrypto"] }

[target.'cfg(not(windows))'.dependencies]
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
