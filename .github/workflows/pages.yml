# The website (site/ + docs/brand), published with GitHub Pages on every push
# to main that touches it. Repo setting: Pages → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/brand/**", "tools/build_site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: tools/build_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
